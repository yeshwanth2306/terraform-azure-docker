trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self

- task: AzureCLI@2
  displayName: 'Test Azure Connection'
  inputs:
    azureSubscription: 'terraform-docker-service-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Successfully authenticated to Azure"
      az account show --query "{Subscription:name, SubscriptionId:id}" --output table

- script: |
    terraform version
  displayName: 'Check Terraform'